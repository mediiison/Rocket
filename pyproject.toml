[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim"
version = "0.1.0"
description = "Small 3-DOF model rocket flight simulator with Monte Carlo landing dispersion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diarova Arina" }]
keywords = ["simulation", "rocketry", "monte-carlo", "numerical-methods"]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rocketsim = "rocketsim.cli:main"

[tool.setuptools.packages.find]
include = ["rocketsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
